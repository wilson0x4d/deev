[project]
name = "deev"
version = "0.0.0"
description = "..an entity framework for Python."
keywords = ["DB", "database", "entity framework", "mapper", "sqlite", "mysql", "mongodb", "clickhouse"]
authors = [
    { name="Shaun Wilson", email="mrshaunwilson@msn.com" }
]
readme = "README.md"
license = "MIT"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python"
]
requires-python = ">=3.11"
dependencies = [
    "appsettings2 (>=2.1.1)",
    "hanaro (>=2.0.1)",
    "hazrakah (>=1.11.14)",
]

[project.optional-dependencies]
clickhouse = [
    "clickhouse-connect[async] (>=1.10.0)"
]
mongodb = [
    "pymongo"
]
mssql = [
    "mssql-python (>=1.15.0)"
]
mysql = [
    "mysql-connector-python (>=26.7.0)"
]

[dependency-groups]
dev = [
    "build",
    "coverage",
    "mypy",
    "punit (>=1.14.1)",
    "py-conventional-semver (>=1.3.5)",
    "twine"
]

[project.urls]
Documentation = "https://deev.readthedocs.io/"
Homepage = "https://github.com/wilson0x4d/deev"
Repository = "https://github.com/wilson0x4d/deev.git"

[project.scripts]
db-migrate = "deev.db_migrate:main"

[tool.setuptools.package-data]
"deev" = ["py.typed", "SKILL.md"]

[tool.uv]
package = true
