[project]
name = "deev"
version = "0.0.0"
description = "..an entity framework for Python."
keywords = ["DB", "database", "entity framework", "mapper"]
authors = [
    { name="Shaun Wilson", email="mrshaunwilson@msn.com" }
]
readme = "README.md"
license = "MIT"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python"
]
requires-python = ">=3.11"
dependencies = [
    "appsettings2 (>=2.1.1)",
    "hanaro (>=1.3.2)",
    "hazrakah (>=1.11.3)"
]

[project.optional-dependencies]
dev = [
    "build",
    "coverage",
    "mypy",
    "punit (>=1.12.5)",
    "py-conventional-semver (>=1.3.4)",
    "twine"
]
mongodb = [
    "pymongo"
]
mysql = [
    "mysql-connector-python"
]

[project.urls]
Documentation = "https://deev.readthedocs.io/"
Homepage = "https://github.com/wilson0x4d/deev"
Repository = "https://github.com/wilson0x4d/deev.git"

[project.scripts]
db-migrate = "deev.db_migrate:main"

[tool.setuptools.package-data]
"deev" = ["py.typed", "SKILL.md"]
